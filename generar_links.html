<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generar Links y QR</title>

  <style>
    body {
      font-family: Arial;
      background: #f0f2f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .nombre {
      font-weight: bold;
      font-size: 18px;
    }

    img {
      margin-top: 10px;
    }

    button {
      margin-top: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>Generador de Links y QR</h2>

<div id="contenedor"></div>

<script>
fetch("datos.json")
  .then(res => res.json())
  .then(data => {

    const contenedor = document.getElementById("contenedor");

    data.forEach(persona => {

      const link = `https://isabellaand.github.io/fichas-qr/index.html?id=${persona.id}`;
      const qr = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(link)}`;

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="nombre">${persona.nombre}</div>
        <div>DNI: ${persona.dni}</div>
        <div>CUIL: ${persona.cuil || "-"}</div>
        <div>Sector: ${persona.sector || "-"}</div>

        <br>
        <input type="text" value="${link}" style="width:100%" readonly>
        <button onclick="copiar('${link}')">Copiar link</button>

        <br>
        <img src="${qr}">
      `;

      contenedor.appendChild(div);
    });

  });

function copiar(texto) {
  navigator.clipboard.writeText(texto);
  alert("Link copiado!");
}
</script>

</body>
</html>
