<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generar links y QR</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; color:#222; }
    .contenedor { max-width: 900px; margin: 35px auto; padding: 20px; }
    .tarjeta { background:#fff; border-radius:16px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    input { width:100%; padding:12px; border:1px solid #ccc; border-radius:10px; font-size:15px; margin:8px 0 20px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px; border-bottom:1px solid #eee; text-align:left; vertical-align:middle; }
    img { width:90px; height:90px; }
    a { color:#0b63ce; word-break:break-all; }
    .nota { color:#666; font-size:14px; }
  </style>
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta">
      <h1>Generador de links y QR</h1>
      <p class="nota">Primero subí estos archivos a internet. Después pegá acá la URL base donde quedó publicado el proyecto.</p>
      <label>URL base del sitio</label>
      <input id="baseUrl" placeholder="Ej: https://usuario.github.io/fichas_qr/" />
      <table>
        <thead>
          <tr>
            <th>Persona</th>
            <th>Link</th>
            <th>QR</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </section>
  </main>

  <script>
    const input = document.getElementById('baseUrl');
    const tabla = document.getElementById('tabla');

    function normalizarBase(url) {
      if (!url) return window.location.href.replace('generar_links.html', '');
      return url.endsWith('/') ? url : url + '/';
    }

    function qrUrl(link) {
      return 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(link);
    }

    async function cargar() {
      const respuesta = await fetch('datos.json');
      const personas = await respuesta.json();
      dibujar(personas);
      input.addEventListener('input', () => dibujar(personas));
    }

    function dibujar(personas) {
      const base = normalizarBase(input.value);
      tabla.innerHTML = '';
      personas.forEach(persona => {
        const link = base + 'index.html?id=' + encodeURIComponent(persona.id);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${persona.nombre}<br><small>DNI: ${persona.dni}</small></td>
          <td><a href="${link}" target="_blank">${link}</a></td>
          <td><img src="${qrUrl(link)}" alt="QR de ${persona.nombre}"></td>
        `;
        tabla.appendChild(tr);
      });
    }

    cargar();
  </script>
</body>
</html>
